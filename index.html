<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plataforma DUA-PI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Área de login -->
    <main class="login-area">

        <section class="login-layout">

            <!-- Painel de apresentação -->
            <div class="login-apresentacao">

                <h2>
                    Aprender é<br>
                    <span class="titulo-destaque">para todos.</span>
                </h2>

                <p>
                    Cada estudante aprende de um jeito.
                    Aqui, todos têm espaço para descobrir,
                    desenvolver e alcançar seu potencial.
                </p>

                <!-- Ilustração dos estudantes -->
                <div class="painel-rodape-inclusivo">

                    <div class="ilustracao-estudantes">

                        <svg viewBox="0 0 340 230"
                             xmlns="http://www.w3.org/2000/svg"
                             role="img"
                             aria-label="Ilustração de estudantes aprendendo juntos">

                            <!-- Fundo decorativo -->
                            <circle cx="170" cy="105" r="94"
                                    fill="#ffffff" opacity="0.10"/>

                            <circle cx="65" cy="65" r="7"
                                    fill="#72efdd"/>

                            <circle cx="275" cy="55" r="6"
                                    fill="#ffd166"/>

                            <path d="M45 115 l9 -9 l9 9 l-9 9z"
                                  fill="#bde5ff"/>

                            <path d="M285 125 l8 -8 l8 8 l-8 8z"
                                  fill="#72efdd"/>

                            <!-- Estudante da esquerda -->
                            <path d="M49 169 Q49 117 98 117
                                     Q147 117 147 169Z"
                                  fill="#ff9fba"/>

                            <circle cx="98" cy="83" r="27"
                                    fill="#f2c6a5"/>

                            <path d="M71 84 Q68 52 98 53
                                     Q128 53 126 86
                                     L116 70 L84 70Z"
                                  fill="#49352f"/>

                            <!-- Estudante do centro -->
                            <path d="M111 169 Q111 105 170 105
                                     Q229 105 229 169Z"
                                  fill="#ffd166"/>

                            <circle cx="170" cy="68" r="30"
                                    fill="#d99a70"/>

                            <path d="M140 69 Q137 33 171 35
                                     Q204 36 201 72
                                     L190 53 L151 53Z"
                                  fill="#26364a"/>

                            <!-- Estudante da direita -->
                            <path d="M193 169 Q193 117 242 117
                                     Q291 117 291 169Z"
                                  fill="#70d6c6"/>

                            <circle cx="242" cy="83" r="27"
                                    fill="#8d573d"/>

                            <path d="M215 84 Q212 52 242 53
                                     Q272 53 270 86
                                     L260 70 L228 70Z"
                                  fill="#302a36"/>

                            <!-- Livro aberto -->
                            <path d="M75 170 Q120 153 170 174
                                     L170 213 Q120 192 75 207Z"
                                  fill="#ffffff"/>

                            <path d="M170 174 Q220 153 265 170
                                     L265 207 Q220 192 170 213Z"
                                  fill="#eaf4ff"/>

                            <path d="M170 174 V213"
                                  stroke="#a9c7e8"
                                  stroke-width="3"/>

                            <!-- Linhas do livro -->
                            <g stroke="#b8cde5"
                               stroke-width="3"
                               stroke-linecap="round">

                                <path d="M91 181 L148 188"/>
                                <path d="M91 192 L148 199"/>
                                <path d="M192 188 L249 181"/>
                                <path d="M192 199 L249 192"/>

                            </g>

                        </svg>

                    </div>

                </div>

            </div>

            <!-- Formulário de login -->
            <div class="login-formulario">

                <div class="formulario-topo">
                    <span class="formulario-etiqueta">ÁREA DE ACESSO</span>

                    <h2>Que bom ter você aqui!</h2>

                    <p>Entre com seus dados para continuar.</p>
                </div>

                <form action="TelaPrincipal.html" method="GET">

                    <!-- Nome de usuário -->
                    <div class="campo-login">
                        <label for="username">
                            Nome de usuário / E-mail
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Digite seu nome ou usuário"
                            autocomplete="username"
                            required>
                    </div>

                    <!-- Senha -->
                    <div class="campo-login">
                        <label for="password">Senha</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required>
                    </div>

                    <!-- Seleção de perfil -->
                    <div class="perfil-selecao">

                        <label>Selecione seu perfil</label>

                        <div class="perfil-opcoes">

                            <button
                                type="button"
                                class="btn-opcao btn-perfil active"
                                data-perfil="aluno"
                                aria-pressed="true">

                                <span>Aluno</span>

                            </button>

                            <button
                                type="button"
                                class="btn-opcao btn-perfil"
                                data-perfil="professor"
                                aria-pressed="false">

                                <span>Professor</span>

                            </button>

                        </div>
                    </div>

                    <!-- Botão entrar -->
                    <button type="submit" class="btn-acessar login-entrar">
                        Entrar na Plataforma <span>→</span>
                    </button>

                </form>

                <!-- Mensagem inferior -->
                <div class="login-nota">
                    <p>Ambiente de aprendizagem inclusivo.</p>
                </div>

            </div>

        </section>

    </main>

    <!-- Rodapé -->
    <footer class="main-footer">
        <p>&copy; 2026 - PIBIC JR / SEDUC TEC</p>
    </footer>

    <!-- SDKs do Firebase v9 (Modular/Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Seu script do projeto -->
<script src="script.js"></script>

</body>
</html>
